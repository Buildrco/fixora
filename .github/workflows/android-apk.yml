name: Fixora Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: fixora-android-apk-main
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK with EAS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project files
        run: |
          test -f package.json
          echo "package.json found"
          node --version
          npm --version

      - name: Install dependencies for Expo config
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build Android APK remotely
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: true

      - name: Download APK
        run: eas build:download --platform android --latest --path fixora-android.apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fixora-android-apk
          path: fixora-android.apk
          if-no-files-found: error
