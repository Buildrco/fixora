name: Fixora OTA Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fixora
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite internal package URLs for GitHub Actions
        run: |
          sed -i 's#http://package-firewall\.replit\.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          if grep -q 'package-firewall.replit.local' package-lock.json; then
            echo 'The lockfile still contains internal package URLs'
            exit 1
          fi


      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Install web bundling dependencies
        run: npx expo install react-native-web react-dom @expo/metro-runtime
        env:
          npm_config_legacy_peer_deps: true
          npm_config_registry: https://registry.npmjs.org

      - name: Setup EAS
        id: setup-eas
        continue-on-error: true
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install EAS CLI fallback
        if: steps.setup-eas.outcome == 'failure'
        run: npm install --global eas-cli

      - name: Verify Supabase connection with Expo preview variables
        run: eas env:exec preview 'node scripts/check-supabase-connection.mjs'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: eas update --channel preview --non-interactive --message "Fixora update"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: true
